<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">A modern profile card showing Java, JavaScript, CSS, HTML, Shell and AIDL usage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="520" height="250" rx="18" fill="url(#bg)"/>
  <circle cx="468" cy="30" r="42" fill="#8b5cf6" opacity=".12"/>
  <circle cx="35" cy="220" r="58" fill="#06b6d4" opacity=".08"/>
