  <rect x="397" y="84" width="62" height="12" fill="#8b5cf6"/>
  <rect x="459" y="84" width="27" height="12" fill="#f97316"/>
  <rect x="486" y="84" width="4" height="12" rx="2" fill="#22c55e"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <circle cx="36" cy="130" r="5" fill="#f59e0b"/><text x="50" y="135" fill="#e2e8f0">Java</text><text x="112" y="135" fill="#94a3b8">40.81%</text>
    <circle cx="270" cy="130" r="5" fill="#facc15"/><text x="284" y="135" fill="#e2e8f0">JavaScript</text><text x="375" y="135" fill="#94a3b8">38.81%</text>
