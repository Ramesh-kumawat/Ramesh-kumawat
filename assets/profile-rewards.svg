<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Profile Rewards</title>
  <desc id="desc">A modern profile card showing public repositories, followers, following and GitHub membership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="520" height="250" rx="18" fill="url(#bg)"/>
  <circle cx="475" cy="28" r="50" fill="#22d3ee" opacity=".1"/>
  <text x="30" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">GitHub Rewards</text>
  <text x="30" y="65" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Small milestones, consistent progress</text>
  <rect x="30" y="84" width="460" height="2" fill="url(#accent)"/>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="108" width="218" height="52" rx="12" fill="#ffffff" opacity=".08"/>
    <text x="48" y="132" fill="#22d3ee" font-size="20">#</text><text x="78" y="129" fill="#cbd5e1" font-size="12" font-weight="700">PUBLIC REPOSITORIES</text><text x="78" y="148" fill="#ffffff" font-size="17" font-weight="700">14</text>
    <rect x="272" y="108" width="218" height="52" rx="12" fill="#ffffff" opacity=".08"/>
    <text x="290" y="132" fill="#818cf8" font-size="20">+</text><text x="320" y="129" fill="#cbd5e1" font-size="12" font-weight="700">FOLLOWING</text><text x="320" y="148" fill="#ffffff" font-size="17" font-weight="700">3</text>
    <rect x="30" y="174" width="218" height="52" rx="12" fill="#ffffff" opacity=".08"/>
    <text x="48" y="198" fill="#f472b6" font-size="20">@</text><text x="78" y="195" fill="#cbd5e1" font-size="12" font-weight="700">FOLLOWERS</text><text x="78" y="214" fill="#ffffff" font-size="17" font-weight="700">0</text>
    <rect x="272" y="174" width="218" height="52" rx="12" fill="#ffffff" opacity=".08"/>
    <text x="290" y="198" fill="#fbbf24" font-size="20">2021</text><text x="356" y="195" fill="#cbd5e1" font-size="12" font-weight="700">MEMBER SINCE</text><text x="356" y="214" fill="#ffffff" font-size="17" font-weight="700">5 years</text>
  </g>
</svg>
